<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "IBM VGA";
  src: url("../public/fonts/WebPlus_IBM_VGA_8x16.woff") format("woff");
}
html, body { margin: 0; }
.og {
  width: 1200px;
  height: 630px;
  background: #0000AA;
  color: #FFFF55;
  font-family: "IBM VGA", ui-monospace, monospace;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 64px;
  box-sizing: border-box;
  image-rendering: pixelated;
}
h1 { margin: 0; font-size: 64px; font-weight: 400; color: #FFFF55; }
p { margin: 24px 0 0; font-size: 28px; color: #FFFFFF; max-width: 52ch; }
.cyan { color: #00AAAA; }
</style>
</head>
<body>
<div class="og">
  <h1>PERSONAL JESUS</h1>
  <p>Your own personal Jesus. Someone to hear your prayers.</p>
  <p class="cyan">Waitlist. God is not on the network yet.</p>
</div>
</body>
</html>
